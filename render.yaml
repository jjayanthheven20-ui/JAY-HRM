services:
  - type: web
    name: jay-job-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: GREENHOUSE_BOARDS
        sync: false
      - key: LEVER_SITES
        sync: false
      - key: OPENAI_API_KEY
        sync: false
